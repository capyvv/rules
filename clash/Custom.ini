custom_proxy_group=📺 国内媒体`select`[]DIRECT`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🚀 节点选择
custom_proxy_group=▶️ 海外媒体`select`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🚀 节点选择`[]DIRECT
custom_proxy_group=📱 Telegram`select`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🚀 节点选择`[]DIRECT

custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
