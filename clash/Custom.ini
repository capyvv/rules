[custom]

; ==========================================
; capyvv 自定义 Clash 订阅转换配置
; 公共规则引用 ACL4SSR/ACL4SSR
; 自定义规则和策略组在本文件维护
; ==========================================


; ==========================================
; 基础直连
; ==========================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list


; ==========================================
; 广告拦截
; ==========================================

ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list


; ==========================================
; 抖音独立分流
; 必须位于 ChinaDomain 和 GEOIP,CN 之前
; ==========================================

ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,douyin.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,douyincdn.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,douyinpic.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,douyinstatic.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,douyinvod.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,iesdouyin.com
ruleset=🎵 抖音代理,[]DOMAIN-SUFFIX,amemv.com


; ==========================================
; 常用服务
; ==========================================

ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list


; ==========================================
; AI 服务
; AI.list 已覆盖 OpenAI、Claude、Gemini、Copilot 等
; ==========================================

ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list


; ==========================================
; 流媒体
; 具体服务放在国外媒体之前
; ==========================================

ruleset=📺 油管视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🎬 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list


; ==========================================
; 国外网站
; ==========================================

ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list


; ==========================================
; 中国网站直连
; ==========================================

ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN


; ==========================================
; 最终规则
; ==========================================

ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================
; 主策略组
; ==========================================

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=☑️ 手动切换`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`600,,100


; ==========================================
; 应用策略组
; 仅引用已有策略组，不在每个应用组展开全部节点
; ==========================================

custom_proxy_group=🎵 抖音代理`select`[]🚀 节点选择`[]♻️ 自动选择`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇭🇰 香港节点`[]♻️ 自动选择`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=📺 油管视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🎬 奈飞视频`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇹🇼 台湾节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]☑️ 手动切换`[]DIRECT
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]☑️ 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]☑️ 手动切换
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择`[]☑️ 手动切换
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT`[]♻️ 自动选择`[]☑️ 手动切换


; ==========================================
; 国家节点组
; 使用 url-test，避免 load-balance 导致出口 IP 变化
; ==========================================

custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|HKG)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇹🇼 台湾节点`url-test`(台|TW|tw|Taiwan|TPE)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|东京|大阪|JP|jp|Japan|NRT|HND|KIX)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|狮城|SG|sg|Singapore|SIN)`https://www.gstatic.com/generate_204`600,,100
custom_proxy_group=🇺🇸 美国节点`url-test`(美国|美|US|us|United States|LAX|SJC|SEA|DFW|ORD|IAD|EWR|MIA|PHX|PDX|ATL|BUF)`https://www.gstatic.com/generate_204`600,,150


; ==========================================
; 规则生成设置
; ==========================================

enable_rule_generator=true
overwrite_original_rules=true
