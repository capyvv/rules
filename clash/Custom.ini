[custom]

; capyvv 自定义 Clash 配置
; 引用 ACL4SSR 公共规则，仅维护个人策略

; =========================
; 本地网络直连（隐藏）
; =========================

; 局域网地址直接使用内置 DIRECT，不创建策略组
ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; =========================
; 精确直连例外（隐藏）
; =========================

ruleset=DIRECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=DIRECT,https://raw.githubusercontent.com/capyvv/rules/main/clash/rules/OfficeDirect.list

; =========================
; 广告规则
; =========================

ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list

; =========================
; AI 服务
; =========================

ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Claude.list
ruleset=🤖 AI服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Gemini.list

; =========================
; 微软与 Apple 服务
; =========================

ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 Apple服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

; =========================
; 海外媒体
; =========================

; YouTube 必须位于 Google.list 前，避免被谷歌服务规则提前匹配
ruleset=▶️ 海外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=▶️ 海外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=▶️ 海外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ProxyMedia.list

; =========================
; Google 服务
; =========================

ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list

; =========================
; 开发工具
; =========================

ruleset=💻 开发工具,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Github.list

; =========================
; 国内媒体
; =========================

; ByteDance.list 已覆盖 douyinstatic.com、zijieapi.com 等字节域名
ruleset=📺 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/ByteDance.list
ruleset=📺 国内媒体,https://raw.githubusercontent.com/capyvv/rules/main/clash/rules/CNMedia.list
ruleset=📺 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Iqiyi.list

; =========================
; Telegram
; =========================

ruleset=📱 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; =========================
; 普通海外服务
; =========================

; 完整代理列表由独立业务分组承接，节点选择只作为基础选择器
ruleset=🌐 海外服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list

; =========================
; 国内直连兜底
; =========================

; 宽泛国内规则放在全部专用分组之后，避免覆盖更具体规则
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN

; 仅真正未匹配的流量进入漏网之鱼
ruleset=🐟 漏网之鱼,[]FINAL

; =========================
; 策略组（以下顺序即 Clash Party 显示顺序）
; =========================

; 基础选择器：不承接任何 ruleset
custom_proxy_group=🚀 节点选择`select`.*`[]DIRECT`[]♻️ 自动选择
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,100

custom_proxy_group=🤖 AI服务`select`.*`[]DIRECT
custom_proxy_group=Ⓜ️ 微软服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=🍎 Apple服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=💻 开发工具`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=📺 国内媒体`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=▶️ 海外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=📱 Telegram`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=🌐 海外服务`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]♻️ 自动选择`.*`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true